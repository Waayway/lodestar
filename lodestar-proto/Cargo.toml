[package]
name = "lodestar-proto"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true

[dependencies]
anyhow = "1"
libc = "0.2"
sha2 = "0.10"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "11", features = ["serde-json-impl"] }

[dev-dependencies]
tempfile = "3"
